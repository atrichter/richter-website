<!doctype html>
<html lang="en">
  <head>
    <!-- Mark JS support before paint to prevent reveal flashes during hydration. -->
    <script>
      document.documentElement.classList.add('js')
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" href="/fonts/lato/LatoLatin-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lato/LatoLatin-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lato/LatoLatin-Italic.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/stix-two-text/STIXTwoText-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/stix-two-text/STIXTwoText-Italic-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
